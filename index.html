function qp(key,n,i,b){var st=ST[key],it=DATA[key][n],pm=document.querySelectorAll('.pm_'+key);if(st.done[n])return;if(i==it[2]){b.classList.add('ok');st.done[n]=1;if(!st.tr[n]){st.sc++;win(key+n)}document.getElementById(key+n).classList.add('done');var t='Skor: '+st.sc+' / '+st.n+(Object.keys(st.done).length==st.n?' 🎉 Selesai!':'');document.querySelectorAll('.sk_'+key).forEach(function(e){e.textContent=t});pm.forEach(function(e){e.innerHTML='💡 No. '+(n+1)+': '+F(it[3])})}else{b.classList.add('no');st.tr[n]=1;b.disabled=true;pm.forEach(function(e){e.textContent='Belum tepat, coba lagi! 💪'})}}
function nz(s){return String(s).toLowerCase().trim().replace(/[.!?]/g,'').replace(/[\s,;]+/g,',').replace(/^,|,$/g,'')}
function ib(){document.getElementById('is').innerHTML='<div class="tip">Isilah titik-titik dengan jawaban yang benar. Huruf besar atau kecil bebas.</div><div class="iq">'+IS.map(function(q,i){return '<div class="ir" onclick="ipem('+i+')"><span>'+(i+1)+'. '+F(q[0])+' ....</span><input type="text" id="in'+i+'" autocomplete="off" aria-label="Jawaban '+(i+1)+'"><small id="ik'+i+'"></small></div>'}).join('')+'</div><div style="display:flex;align-items:center;gap:14px"><button class="chk" onclick="ichk()">Periksa jawaban</button><span class="res" id="ires"></span></div><div class="pem pm_is"></div>'}
function mjb(){var L='ABCDE';document.getElementById('mj').innerHTML='<div class="tip">Pasangkan kosakata dengan arti di Kolom B. Pilih huruf yang tepat. <span class="sk_mj" style="float:right;color:var(--ink);font-family:Fredoka,sans-serif;font-size:21px">Skor: 0 / 5</span></div><div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><b style="align-self:center">Kolom B:</b>'+MB.map(function(t,i){return '<span class="bank">'+L[i]+'. '+t+'</span>'}).join('')+'</div>'+MJ.map(function(q,i){return '<div class="tr" id="mj'+i+'"><div class="qt">'+(i+1)+'. '+q[0]+'</div><select id="ms'+i+'" onchange="mjp('+i+')" aria-label="Jawaban '+(i+1)+'"><option value="">— pilih —</option>'+L.split('').map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></div>'}).join('')+'<div class="pem" id="mjp">Ayo jodohkan! 💪</div>'}
function mjp(i){var s=document.getElementById('ms'+i);if(!s.value)return;var ok=s.value==='ABCDE'[MJ[i][1]];s.className=ok?'ok':'no';document.getElementById('mj'+i).classList.toggle('done',ok);if(ok){mjd[i]=1;win('m'+i)}else delete mjd[i];var n=Object.keys(mjd).length;document.querySelector('.sk_mj').textContent='Skor: '+n+' / '+MJ.length+(n==MJ.length?' 🎉 Selesai!':'');document.getElementById('mjp').innerHTML=ok?'💡 No. '+(i+1)+': '+MJ[i][2]:'Belum tepat, coba lagi! 💪'}
function rt(b){b.classList.toggle('ok');b.textContent=b.classList.contains('ok')?'☑':'☐'}
function ichk(){var n=0;IS.forEach(function(q,i){var e=document.getElementById('in'+i),ok=nz(e.value)==nz(q[1]);e.className=ok?'ok':'no';document.getElementById('ik'+i).textContent=ok?'✅':'Kunci: '+q[2];if(ok){n++;win('i'+i)}});document.getElementById('ires').textContent=n+' / '+IS.length+(n==IS.length?' 🎉':' — periksa yang merah!');document.querySelector('.pm_is').textContent='Ketuk baris untuk melihat pembahasan.'}
function ipem(i){if(document.getElementById('ik'+i).textContent)document.querySelector('.pm_is').innerHTML='💡 No. '+(i+1)+': '+F(IS[i][3])}
function fit(){var s=Math.min(innerWidth/1123,innerHeight/794),w=document.getElementById('wrap');pg.style.transform='scale('+s+')';w.style.width=1123*s+'px';w.style.height=794*s+'px';w.style.top=Math.max(0,(innerHeight-794*s)/2)+'px'}
addEventListener('resize',fit);addEventListener('keydown',function(e){if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key=='ArrowRight')go(cur+1);if(e.key=='ArrowLeft')go(cur-1)});
qb('bs',BS,[['ts',0,5]],'ts');qb('pg',PG,[['mc0',0,5],['mc1',5,10]],'pg');ib();mjb();fit();go(0);
</script>
</body>
